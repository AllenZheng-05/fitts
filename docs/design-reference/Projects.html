<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitts — Project switcher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A3FD6}a:hover{color:#1B2BA8}
:focus-visible{outline:2px solid #3D5AFE;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 800px; background: #FBFAF7; color: #16161D; font-family: 'Geist', system-ui, sans-serif; font-size: 15px; overflow: auto; display: flex; flex-direction: column">

<header style="position: relative; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 20px">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><path d="M10 18 V 8 H 20" fill="none" stroke="#3D5AFE" stroke-width="2" stroke-linecap="round"></path><path d="M54 46 V 56 H 44" fill="none" stroke="#3D5AFE" stroke-width="2" stroke-linecap="round"></path><path d="M38 15 C 30 13, 27 18, 27 25 V 49" fill="none" stroke="#16161D" stroke-width="7" stroke-linecap="round"></path><path d="M19 31 H 35" stroke="#16161D" stroke-width="7" stroke-linecap="round"></path><circle cx="45" cy="31" r="5.5" fill="#FF6B5B"></circle><rect x="6.5" y="4.5" width="7" height="7" fill="#FFFFFF" stroke="#3D5AFE" stroke-width="2"></rect><rect x="50.5" y="52.5" width="7" height="7" fill="#FFFFFF" stroke="#3D5AFE" stroke-width="2"></rect></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.02em">Fitts</span>
</div>
<button type="button" aria-expanded="true" aria-controls="project-menu" aria-label="Switch project, current: demo/chat" style="min-height: 40px; padding: 0 12px; border: 1.5px solid #3D5AFE; border-radius: 999px; background: #E8ECFF; color: #16161D; font-family: 'Geist Mono', monospace; font-size: 12px; display: inline-flex; align-items: center; gap: 6px">demo/chat<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<ol aria-label="Run progress" style="list-style: none; margin: 0 auto; padding: 3px; display: flex; gap: 3px; border: 1px solid #16161D; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 600">
<li style="padding: 7px 14px; border-radius: 999px; color: #0B6B4B">Interview ✓</li>
<li style="padding: 7px 14px; border-radius: 999px; color: #0B6B4B">Audit &amp; fix ✓</li>
<li aria-current="step" style="padding: 7px 14px; border-radius: 999px; background: #16161D; color: #FFFFFF">Done</li>
</ol>
<select aria-label="Permission mode" style="min-height: 40px; padding: 0 10px; border: 1px solid #16161D; border-radius: 12px; background: #FFFFFF; color: #16161D; font: inherit; font-size: 14px"><option selected="selected">Ask when unsure</option></select>
<button type="button" aria-label="Brief" title="Brief" style="min-width: 40px; min-height: 40px; border: 1px solid #16161D; border-radius: 12px; background: #FFFFFF; color: #16161D; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><path d="M9 13h6M9 17h4"></path></svg></button>
<span style="padding: 10px 12px; border: 1px solid #16161D; border-radius: 12px; background: #FFFFFF; font-family: 'Geist Mono', monospace; font-size: 13px">$13.92</span>
</header>

<div aria-hidden="true" style="position: relative; flex: 1; min-height: 0; display: flex; gap: 14px; padding: 4px 20px 20px; opacity: 0.45">
<div style="flex: 0 0 520px; border: 1.5px solid #16161D; border-radius: 18px; background: #F3F1EC"></div>
<div style="flex: 1 1 auto; border: 1.5px solid #16161D; border-radius: 18px; background: #FFFFFF"></div>
</div>

<div id="project-menu" role="dialog" aria-label="Projects" style="position: absolute; left: 132px; top: 60px; width: 440px; background: #FFFFFF; border: 1.5px solid #16161D; border-radius: 18px; box-shadow: 4px 4px 0 #16161D; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<label for="p-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Find a project</label>
<input id="p-search" type="text" placeholder="Find a project…" style="min-height: 44px; padding: 0 12px; border: 1px solid #16161D; border-radius: 12px; font: inherit; box-sizing: border-box; outline: 2px solid #3D5AFE; outline-offset: 2px">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<li><button type="button" aria-current="true" style="width: 100%; padding: 10px 12px; border: 1.5px solid #3D5AFE; border-radius: 12px; background: #E8ECFF; color: #16161D; font: inherit; text-align: left; display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #2BD9A0; border: 1px solid #16161D"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong>demo/chat</strong><span style="font-size: 12px; color: #5A5A66">localhost:5173 · finished yesterday · 9 PRs</span></span><span style="font-size: 12px; font-weight: 700; color: #1B2BA8">Current</span></button></li>
<li><button type="button" style="width: 100%; padding: 10px 12px; border: 1px solid #16161D; border-radius: 12px; background: #FFFFFF; color: #16161D; font: inherit; text-align: left; display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #3D5AFE; border: 1px solid #16161D"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong>hartwell-site</strong><span style="font-size: 12px; color: #5A5A66">localhost:3000 · running in the background · step 18</span></span><span style="font-size: 12px; font-weight: 700; color: #2A3FD6">Running</span></button></li>
<li><button type="button" style="width: 100%; padding: 10px 12px; border: 1px solid #16161D; border-radius: 12px; background: #FFFFFF; color: #16161D; font: inherit; text-align: left; display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; border: 1px solid #8A8A93"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong>portfolio</strong><span style="font-size: 12px; color: #5A5A66">allenzheng.dev · verified · never audited</span></span></button></li>
</ul>
<button type="button" style="min-height: 44px; border: 1px dashed #16161D; border-radius: 12px; background: #FFFFFF; color: #16161D; font: inherit; font-weight: 600">+ Add a project</button>
<p style="margin: 0; font-size: 12px; color: #5A5A66; line-height: 1.5">⌘P to switch. Each project keeps its own brief, findings, runs and spending. One run at a time: starting a second asks to pause the first. A run in the background still notifies you when it needs you.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
