# Packaging (SPEC-phase2 §16). Unsigned builds: Windows NSIS x64 (built and tested locally),
# macOS dmg and Linux AppImage (built in CI). Releases publish to GitHub on a v* tag; nothing
# publishes from a local build.
appId: app.fitts.desktop
productName: Fitts
copyright: Copyright © 2026 Allen Zheng
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  # The window icon (main/window.ts resolves it next to out/).
  - resources/icon.png
  - resources/icon.ico
extraResources:
  # The one-file Fitts plugin a Vite project can get in a PR.
  - from: resources/plugin
    to: plugin
  # three.js, copied into a project when a redesign uses a 3D part.
  - from: resources/vendor
    to: vendor
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Fixed names, so the site's .../releases/latest/download/<name> links never change.
  artifactName: Fitts-Setup.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  icon: resources/icon.png
  artifactName: Fitts-${arch}.${ext}
  identity: null
  # Unsigned today (identity null); when a signing identity is set, the hardened runtime needs
  # the audio-input entitlement for the microphone (SPEC-phase4 §10).
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    # Why macOS shows each prompt. The mic is for talking to Fitts; the folders are where
    # projects usually live, and Fitts reads their code to understand them.
    NSMicrophoneUsageDescription: Fitts listens when you talk to it.
    NSDocumentsFolderUsageDescription: Fitts reads the code of the project you pick, to understand and fix it.
    NSDesktopFolderUsageDescription: Fitts reads the code of the project you pick, to understand and fix it.
    NSDownloadsFolderUsageDescription: Fitts reads the code of the project you pick, to understand and fix it.
linux:
  target: [AppImage]
  category: Development
  icon: resources/icon.png
  artifactName: Fitts.${ext}
publish:
  provider: github
  owner: AllenZheng-05
  repo: fitts
  releaseType: release
